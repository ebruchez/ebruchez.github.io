<!--
  The Footer
-->

<footer class="d-flex w-100 justify-content-center">
  <div class="d-flex justify-content-between align-items-center">
    <div class="footer-left">
      <p class="mb-0">
        © {{ 'now' | date: "%Y" }}
        {% assign owner_link = site.social.links[0] | default: '/' %}
        <a href="{{ owner_link | relative_url }}">{{ site.social.name }}</a>.
        {% if site.data.rights.brief %}
        <span title="{{ site.data.rights.verbose }}">{{ site.data.rights.brief }}</span>
        {% endif %}
      </p>
    </div>

    <div class="footer-right">
      <p class="mb-0"></p>
    </div>

  </div> <!-- div.d-flex -->
</footer>
