<!--
  JS selector for site.
-->

<script defer src="{{ '/assets/js/site.js' | relative_url }}?v={{ site.time | date: '%s' }}"></script>

{% if page.math %}
  <!-- MathJax -->
  <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
{% endif %}

{% if jekyll.environment == 'production' and site.google_analytics.id and site.google_analytics.id != '' %}
  {% include google-analytics.html %}
{% endif %}
