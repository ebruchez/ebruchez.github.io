{% assign _carousel_id = include.id | default: 'carousel' %}
{% assign _carousel_label = include.label | default: 'Image carousel' %}
{% assign _slides = include.slides %}
<section class="post-carousel" id="carousel-{{ _carousel_id }}" aria-roledescription="carousel" aria-label="{{ _carousel_label }}">
  <div class="post-carousel-toolbar">
    <button type="button" class="post-carousel-btn post-carousel-prev" data-direction="previous" aria-label="Previous snapshot" aria-disabled="true">
      <svg aria-hidden="true" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><polyline points="12,4 6,10 12,16"/></svg>
    </button>
    <nav class="post-carousel-markers" aria-label="Choose a snapshot">
      {%- for slide in _slides -%}
      <button type="button" class="post-carousel-marker" data-slide-index="{{ forloop.index0 }}" aria-label="{{ slide.year }} ({{ forloop.index }} of {{ _slides.size }})"{% if forloop.first %} aria-current="true"{% endif %}>{{ slide.year }}</button>
      {%- endfor -%}
    </nav>
    <button type="button" class="post-carousel-btn post-carousel-next" data-direction="next" aria-label="Next snapshot"{% if _slides.size <= 1 %} aria-disabled="true"{% endif %}>
      <svg aria-hidden="true" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><polyline points="8,4 14,10 8,16"/></svg>
    </button>
  </div>
  <div class="post-carousel-track" tabindex="0" role="group" aria-label="Snapshots">
    {%- for slide in _slides -%}
    <figure class="post-carousel-slide" role="group" aria-roledescription="slide" aria-label="{{ forloop.index }} of {{ _slides.size }}" data-slide-label="{{ slide.year | escape }}">
      <div class="post-carousel-stage">
        <a href="{{ slide.src | relative_url }}" class="img-hyperlink post-carousel-link" data-lightbox="{{ _carousel_id }}" data-caption="{{ slide.caption | escape }}">
          <img src="{{ slide.src | relative_url }}" alt="{{ slide.alt | escape }}" width="{{ slide.width | default: 2048 }}" height="{{ slide.height | default: 1536 }}" loading="lazy" decoding="async">
        </a>
      </div>
      {%- if slide.caption -%}
      <figcaption class="post-carousel-caption">{{ slide.caption }}</figcaption>
      {%- endif -%}
    </figure>
    {%- endfor -%}
  </div>
  <p class="visually-hidden post-carousel-status" role="status" aria-live="polite"></p>
</section>
<script type="module" src="{{ '/assets/js/carousel.js' | relative_url }}"></script>
