<!--
  Mermaid diagram loader (zero jQuery, dark/light reactive)
-->

<script defer src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    if (typeof mermaid === 'undefined') return;

    function currentMermaidTheme() {
      const mode = document.documentElement.getAttribute('mode');
      if (mode === 'dark') return 'dark';
      if (mode === 'light') return 'default';
      return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'default';
    }

    for (const codeEl of document.querySelectorAll('pre > code.language-mermaid')) {
      const pre = codeEl.parentElement;
      const src = codeEl.textContent || '';
      const container = document.createElement('div');
      container.className = 'mermaid';
      container.setAttribute('data-mermaid-src', src);
      container.textContent = src;
      pre.classList.add('unloaded');
      pre.after(container);
    }

    async function renderMermaid() {
      const nodes = Array.from(document.querySelectorAll('.mermaid[data-mermaid-src]'));
      if (nodes.length === 0) return;
      for (const node of nodes) {
        node.removeAttribute('data-processed');
        node.textContent = node.getAttribute('data-mermaid-src') || '';
      }
      mermaid.initialize({ startOnLoad: false, theme: currentMermaidTheme() });
      await mermaid.run({ nodes });
    }

    renderMermaid();
    window.addEventListener('themechange', renderMermaid);
  });
</script>
