- id: les-compagnons-du-crepuscule
  read_date: 2021-11
  title: Les compagnons du crépuscule
  language: French
  authors:
  - François Bourgeon
  sub_items:
  - title: 1. Le sortilège du bois des brumes
    bedetheque_url: >-
      https://www.bedetheque.com/BD-Compagnons-du-crepuscule-Tome-1-Le-sortilege-du-bois-des-brumes-7737.html
    rating: 5
  - title: 2. Les Yeux d'étain de la ville glauque
    bedetheque_url: >-
      https://www.bedetheque.com/BD-Compagnons-du-crepuscule-Tome-2-Les-Yeux-d-etain-de-la-ville-glauque-7738.html
    rating: 5
  - title: 3. Le dernier chant des Malaterre
    bedetheque_url: >-
      https://www.bedetheque.com/BD-Compagnons-du-crepuscule-Tome-3-Le-dernier-chant-des-Malaterre-142.html
    rating: 5
    review: >-
      I would rate this album 6/5 as it is truly a masterpiece. The research needed for this album must
      have been incredible. The characters, decors, atmosphere, all contribute to an atmosphere that is
      truly incredible. There is also so much cruelty, yet a few of the characters are like the supposed
      reader: they despise envy, injustice, power, and pain, yet have to endure that in this dark ages
      world. I just realized that there is a book, ["Dans le sillage des sirènes"](https://www.bedetheque.com/BD-Compagnons-du-crepuscule-HS-Dans-le-sillage-des-sirenes-985.html),
      on the topic. I need to get it.
