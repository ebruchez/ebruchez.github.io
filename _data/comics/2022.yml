- id: topolino-in-team-10-a-spasso-nel-tempo
  read_date: 2022-12
  title: Topolino in Team - 10. A spasso nel tempo
  language: Italian
  url: https://www.panini.it/shp_ita_it/topolino-a-spasso-nel-tempo-1wsudi097-it08.html
  review: >-
    A series of stories about time travel, except for the last one. See also [this review in Italian](https://emanueledigiuseppe.blogspot.com/2022/11/topolino-in-team-spasso-nel-tempo.html).
  sub_items:
  - title: Topolino e lo Scettro del Tempo
    year: 1992
    writers:
    - Sarda
    artists:
    - Valussi
    review: >-
      Your typical fantasy story. Here, Topolino (Mickey) and Pippo (Goofy) end up in a separate "weather"
      dimension, with 4 realms, one for each season. But a bad guy wants to steal the weather sceptre
      that is usually passed at each season transition between the realms. For that purpose, he captures
      one king, and plans to do the same with the other rulers. But the plan is thwarted. I rather like
      the graphics. The bad guy is particularly well done. Small love story in the background with a character
      who looks a little like Astérix.
  - title: Topolino e il Mistero dei Dinosauri
    year: 1986
    writers:
    - Conicna
    artists:
    - Asteriti
    review: >-
      Asteriti's style is quite recognizable. In particular, Mickey's mouth is done differently. This
      is part of a set of stories that revolve around professor Zapotec and his assistant Marlin, who
      have a time machine. They send Topolino and Pippo in the past, here to understand what happened
      to the dinosaurs. Hint: they understood they were doomed and managed to go live underwater. Not
      that great of a premise, I'd say.
  - title: Topolino e il segreto di Eta Beta
    year: 2016
    writers:
    - Zemelo
    artists:
    - Limido
    review: Another Zapotec/Marlin story. A typical time travel paradox.
  - title: Topolino e l'Inseguimento Epocale
    year: 2017
    writers:
    - Cirillo
    artists:
    - Held
    review: >-
      Another Zapotec/Marlin story. Following a Doctor Who clone in the past. Instead of a police station,
      the character drives a London bus.
  - title: Topolino e la Contessa Contesa
    year: 2014
    writers:
    - Panini
    artists:
    - Zironi
    review: >-
      No time travel here, but a story in a different universe, in London. Someone steals Mickey's identity,
      but the bad guy is unmasked and Mickey can be engaged with his Minnie.
- id: topolino-e-l-isola-di-quandomai
  read_date: '2022-10-19'
  title: Topolino e l'isola di quandomai
  year: 2010
  url: https://disney-comics.fandom.com/it/wiki/Topolino_e_l%27isola_di_Quandomai
  review: |-
    Sceneggiatura e disegni: Casty

    Casty is one of the few modern authors of new Mickey ("Topolino" in Italian) stories. I read this story in the large format hardcover "Limited Deluxe Edition" collection, of which I have a few albums. I like Casty's style in general. His stories are definitely in the main tradition of comic books Mickey Mouse, including Floyd Gottfredson and earlier Italian artists. In this story you find Mickey, Minnie, Goofy, but also Peg Leg Pete ("Gambadilegno" in Italian) and his partner Trudy. There is jealousy involved, as well as a team of scientists. There is also a very strong environmental message, in fact that is the main point of the story.
