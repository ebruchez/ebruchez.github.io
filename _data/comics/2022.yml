- id: luc-orient-10-le-6eme-continent
  read_date: 2022-03
  title: Luc Orient - 10. Le 6ème continent
  year: 1976
  bedetheque_url: https://www.bedetheque.com/BD-Luc-Orient-Tome-10-Le-6eme-continent-24362.html
  reread: true
  review: >-
    A good story. Now one thing that doesn't make any sense is Luc Orient skiing! First, you cannot just
    go downhill all the time. You need cross-country skis and skins to explore an area like they do. Second,
    he looks like a beginner in some spots, and yet a more accomplished skier in some other spots. Skiing
    is something you learn over years, not something you just improvise. Also, I am not sure that there
    is a good rationale for the destruction of the underground city: they are discovered, therefore they
    must be destructed? That seems like a poor philosophy on the part of the (long dead) leader of the
    group.
