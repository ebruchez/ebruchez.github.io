- id: dragonero-il-regno-dei-lupi
  read_date: '2023-04-04'
  title: Dragonero - Il regno dei lupi
  year: 2022-07
  language: Italian
  url: https://www.sergiobonelli.it/dragonero/2022/06/27/gallery/uno-speciale-davvero-speciale-1021853/#1
  review: |-
    Testi: Luca Enoch

    Disegni e colori: Massimo Dall'Oglio
  notes: >-
    Essentially the story of a hostage crisis at the top of a monastery, where a young Ian Aranill plays
    an important role. The hostage takers suffered from war and oppression, but their leader turned extremely
    cruel. Only at the ultimate instant does he respect Ian's life by taking the "morso del crotalo",
    a fast poison, and ending his own life. There is cynicism in this story, about how empires can blindly
    hurt or destroy entire people while expanding, especially if those people are different (as in "savages").
    Ian bitterly reflects on that. The Empire, in Dragonero, remains an empire. But in the end some hostages
    are saved, Ian and Leyll (Ian's friend) survive, the main bad guy is dead, and the corrupt commander
    from the Empire, Faushéviez, is killed as well. Overall, this is a good story, with beautiful art
    by Dall'Oglio.
