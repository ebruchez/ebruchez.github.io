  - read_date: '2023-06-22'
    title: Megalex - 3. Le cœur de Kavatah
    year: 2008
    language: French
    reread: true
    writers:
    - Alejandro Jodorowsky
    artists:
    - Fred Beltran
    colors:
    - Fred Beltran
    review: "- I didn't remember much of this series, except some kind of vague memory that it was somehow
      rushed. I reread the 3 volumes in one shot. For the first two volumes, the most striking problem
      is the colors. They push the use of computer colors to the extreme, resulting in a result that is
      a little bit disconcerting. You like the result or you don't, but I think it looked a little unpleasant
      at the time, and it still does now. The third volume, published much later, is distinct from the
      first two, and much better in that regard, showing that Beltran learned to master his coloring techniques.\n-
      The drawings are overall very good.\n- The story exhibits common Jodorowsky themes: extreme cruelty,
      cyborgs, religion and fanaticism, the androgynous angel, but also final redemption.\n- The computerized
      mummified king is a genius idea!\n- The main characters exhibit very human (in a good sense) traits,
      and you root for them.\n- The ending is extraordinarily abrupt, concluding the story in a single
      page, where a few pages would have been better. I suspect that the series simply had to be concluded
      for commercial reasons.\n- All in all, I think the series is a little underrated. Reading it anew
      in one session, the story and its universe are fairly compelling. It remains imperfect, due to the
      uneven coloring approach and the rushed ending .\n- I found a review I wrote in 2008 and published
      on Amazon.fr. It's fairly well-written ;):\n  \n  \"Ceci est le dernier tome du cycle, attendu depuis
      des années. Tout est révélé ici de l'histoire de Mégalex, et la trame en cours dans les deux premiers
      volumes se dénoue.\n  \n  Les dessins restent magnifiques. Mais si les deux premiers tomes allaient
      parfois jusqu'au photoréalisme dans le traitement des couleurs par ordinateur, on ne trouve rien
      de tel ici avec des couleurs plus classiques. Je préfère personnellement cette nouvelle approche
      plus chaleureuse, mais le résultat est un troisième tome très différent graphiquement des deux premiers,
      ce qui est dommage si on considère ce tome dans l'ensemble de son contexte.\n  \n  Point plus important,
      on sent une accélération très désagréable de l'histoire vers la fin : des événements majeurs sont
      résumés en à peine quelques cases, et l'épilogue prend exactement une seule case sur la dernière
      page. Est-ce que l'histoire était prévue en 4 tomes plutôt que trois? Cela semble possible. Peut-être
      que l'éditeur a cherché une solution pour conclure rapidement un cycle problématique. C'est dommage
      car le monde de Mégalex est fascinant et on aurait pu facilement en faire un traitement plus satisfaisant.\""
