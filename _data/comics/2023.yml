- id: lefranc-tome-33-le-scandale-ares
  read_date: '2023-01-18'
  title: Lefranc - Tome 33. Le scandale Arès
  year: 2022
  language: French
  writers:
  - Roger Seiter
  artists:
  - Régric
  bedetheque_url: https://www.bedetheque.com/BD-Lefranc-Tome-33-Le-scandale-Ares-446291.html
  rating: 4
  review: >-
    Good art. Lots of explanations, maybe too many. The story is a little implausible (Lefranc stories
    tend to be, anyway), but well-anchored in history. It seems that World War II is always a good setting.
    Here, we learn that a French inventor built prototypes of planes that could have stopped the Germans
    in 1940. In fact, they did use the prototypes to completely destroy a convoy of 30 German tanks. But,
    due to conflict of interest, their planes were not considered by the officials in charge of selecting
    the companies that would build planes for the French defense. The story was buried, but unearthed
    by Lefranc and the daughter of the sole German survivor of the 1940 attack. The officials involved
    try to brutally suppress the story, but Lefranc and his friends get the story out. The retired inventor
    flies the remaining working prototype out of france to fight Russians invading Hungary. That part
    especially is quite implausible, but it's timely with the Russian invasion of Ukraine.
