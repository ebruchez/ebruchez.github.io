- id: thorgal-40-tupilaks
  read_date: '2023-01-03'
  title: Thorgal - 40. Tupilaks
  year: 2022
  language: French
  writers:
  - Yann
  artists:
  - Fred Vignaux
  bedetheque_url: https://www.bedetheque.com/BD-Thorgal-Tome-40-Tupilaks-457535.html
  review: >-
    I am not enthused by the representation of Neokóra, as mentioned in my notes for album 39, the long
    recaps of the history of the Atlants, or the over-explanations. There is also a little too much that
    reminds us of current events (pandemic, AI), while I think it's better if the series remains intemporal.
    I am a little surprised that Slive has now turned nice and I think that this character is depicted
    more plausibly in the Jeunesse de Thorgal series. This said, a science-fiction background is at the
    core of the whole Thorgal series, and has been guiding large arcs of the series (such as the travel
    to Qâ). The Neokóra and Tupilaks diptych just happens to revive that aspect of Thorgal, and I have
    nothing against that. Nor do I have anything in principle against returning to the spaceship and developing
    that aspect of Thorgal's background. But the story does feel a little confused and, again, loses itself
    in too many explanations. On the positive side, with the spaceship destroyed, that part of the Thorgal
    universe should be definitely closed, at least in the main series. This episode also allows the introduction
    of a new character, Boréale, who we can only surmise will become Jolan's companion. In general, I
    like that the series lets its main characters grow up and age.
