- id: apres-l-incal
  read_date: '2023-07-13'
  title: Après L'Incal
  writers:
  - Alejandro Jodorowsky
  artists:
  - Moebius
  bedetheque_url: https://www.bedetheque.com/BD-Incal-Apres-l-Tome-1-Le-nouveau-reve-2101.html
  reread: true
  tags:
  - french
  review: >-
    This album is part of the confusing Après L'Incal/Final Incal series. Après L'Incal was the initial
    story, but Jodorowsky was unhappy with the idea of having John Difool wake up from a dream and didn't
    want to continue the storyline. However things didn't work out with Moebius for a new storyline, and
    so the series stopped there, abandoned. Final Incal is Jodorowsky's new storyline, done with Ladrönn
    instead of Moebius. The story of the first album is similar-but-different, and then Final Incal continues
    on for two albums. Curiously, a second volume of Après L'Incal came out, but it appears (I haven't
    checked in person)
