- id: disney-d-autore-corrado-mastantuono
  read_date: '2018-12-03'
  title: Disney d'autore - Corrado Mastantuono
  language: Italian
  url: https://www.amazon.com/Disney-dautore-Corrado-Mastantuono/dp/8852217258
  review: |-
    "Le straordinarie avventure dei personaggi di Paperopoli et di Topolinia tra ironia e divertimento"

    I didn't realize before reading this that I had read a number of stories by Mastantuono. I really like his style. The character of Bum Bum is interesting in that he takes the central spot of a number of stories, playing the role usually taken by Donald Duck (Paperino). Instead, when Bum Bum is present, Paperino is repositioned as a character who behaves more normally.
