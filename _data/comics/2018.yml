- id: le-secret-de-l-espadon
  read_date: '2018-10-10'
  title: Le secret de l'Espadon
  year: 1950-1953
  authors:
  - Edgar P. Jacobs
  bedetheque_url: https://www.bedetheque.com/BD-Blake-et-Mortimer-Tome-1-Le-Secret-de-l-Espadon-T1-7652.html
  rating: 5
  reread: true
  review: >-
    Yes, it is about the "Yellows" (probably Chinese) against the rest of the world, and we wouldn't dare
    write a story like this today, but it is a fantastic story about fighting a totalitarian regime wanting
    to take over the world, and a wonderful story of resistance for freedom. I think that the story is
    really well written, especially given the fact that the author had to go very fast, and you eagerly
    follow over three volumes the heroes as they have setback upon setback. Not everybody is depicted
    in a negative way: resistance fighters are Indian, Arabs, and near the end Shanghai's "Tchang-Li-Tchek"
    joins the resistance as well.
