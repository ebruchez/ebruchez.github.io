# Comic book reads for 2019
- id: dragonero-avventura-a-darkwood
  read_date: '2019-12-23'
  title: Dragonero. Avventura a Darkwood
  language: Italian
  url: https://en.shop.sergiobonelli.it/books/2019/02/25/book/dragonero-avventura-a-darkwood-1004270/
  review: >-
    A "team-up" with the character of Zagor. Somehow the two universes get connected via special stones
    that allow traveling through time and space. Not knowing Zagor, I would tend to prefer the character
    of Dragonero. Zagor is a little bit too much of the perfect hero in looks and dress, while his sidekick,
    Cico, is a little too burlesque. But overall the story is not bad.
- id: dragonero-la-fine-di-yastrad
  read_date: '2019-12-17'
  title: Dragonero. La fine di Yastrad
  language: Italian
  url: https://en.shop.sergiobonelli.it/dragonero/2018/08/29/book/dragonero-la-fine-di-yastrad-1003379/
  review: >-
    There is a clear parallel between the Eleusi and the Jews. The Eleusi live in ghettos, are educated
    but disliked and blamed when things go bad. The similarity stops there, as they are "Alchimisti ed
    Erboristi" (alchemists and herborists).
