- id: autour-de-blake-et-mortimer-le-dernier-pharaon
  read_date: '2025-08-01'
  title: Autour de Blake et Mortimer - Le dernier pharaon
  year: 2019
  language: French
  writers:
  - Jaco Van Dormael
  - Thomas Gunzig
  - Laurent Durieux
  artists:
  - François Schuiten
  bedetheque_url: https://www.bedetheque.com/BD-Blake-et-Mortimer-Les-Aventures-de-HS3-Le-Dernier-Pharaon-367398.html
  reread: true
  review: |-
    - First reread of this 2019 story.
    - This is a very long story (around 170 pages in the large, horizontal format that I have, but 85 pages in the regular format), with incredibly beautiful art by Schuiten.
    - The art is particularly showcased in the large format, and the colors by Laurent Durieux appear beautiful here.
    - It is, of course, only lightly related to the Blake et Mortimer universe. This ties in to the Mystère de la Grande Pyramide, but in spirit, it is more of a Schuiten and Peeters Cités Obscures story.
    - As found in a review, the scenario contains "d'ésotérisme, de politique, de terrorisme, d’environnement, de science-fiction, de fantastique, de monstres préhistoriques, de thérapies « nouvelâgeuses » et de complots millénaristes, sans oublier les nombreuses séquences oniriques qui ponctuent l’ensemble". So yes, it is a little confused.
    - I do not agree with the implied premise that technology is inherently bad, and that it would be a good thing to turn it off. Neither would Mortimer, I think.
    - It is also a little weird that Blake and Mortimer, while they work together for the same purpose, are presented as having drifted apart over time. Why would these two heroes fall, or become unappreciated by the world at large?
    - I wish the scenario was a little better, but it fits ok in the Schuiten and Peeters universe. The art being amazing makes up for it in great part.
  notes: >-
    The premise is fantastic, if not phantasmagoric: a sort of secret society, initiated by the ancient
    Egyptians, who built a system of pyramids, including an inverted one below the ground of the Brussels
    Palace of Justice, which are necessary for a technological civilization. This massive system can be
    turned off by a mechanism at the top of the palace, only by the "Last Pharaoh" who turns out to be
    Pr. Mortimer. He does manage to do so, eventually, and the world is saved but also loses advanced
    technology.
- id: mickey-e-la-terra-degli-antichi
  read_date: '2025-07-30'
  title: Mickey e la Terra degli Antichi
  year: 2022
  language: Italian
  writers:
  - Denis-Pierre Filippi
  artists:
  - Silvio Camboni
  url: https://www.amazon.it/-/en/dp/B09J1X5BB9
  review: |-
    - This is a beautifully made Mickey story. The art, in particular, is excellent.
    - The authors revive classic characters from the Floyd Gottfredson era, including Phantom Blot, Pete, and the three monkeys Ecks, Doublex, and Triplex, who are all the main villains of the story.
    - Minnie is shown as driven and courageous, and she is not just a damsel in distress.
    - This universe has potential, and I am hoping for a follow-up story.
    - When I bought the Italian edition, I thought that it was the original one. But the original appears to be the French edition, which, it seems, has better printing quality.
- id: dragonero-il-viaggio-degli-eroi
  read_date: '2025-07-23'
  title: Dragonero - Il viaggio degli eroi
  year: 2024
  language: Italian
