- id: alix-tome-38-les-helvetes
  read_date: '2025-03-17'
  title: Alix - Tome 38. Les Helvètes
  year: 2019
  writers:
  - Mathieu Bréda
  artists:
  - Marc Jailloux
  bedetheque_url: https://www.bedetheque.com/BD-Alix-Tome-38-Les-Helvetes-377356.html
  rating: 5
  reread: true
  review: |-
    - This is one of the best Alix stories post-Martin. The intro says it's "freely inspired by a synopsis by Jacques Martin", and that might be part of the reason why it is so good.
    - But the art by Jailloux is really excellent as well.
    - I have a bias since the story largely takes place on modern Switzerland territory, and there is an appeal to see the beautiful Alps, lakes, and a largely untouched nature.
    - The sacrifice of Balios is tough, but we were forewarned early in the story that the great horse would not make it.
- id: alix-tome-33-britannia
  read_date: '2025-03-15'
  title: Alix - Tome 33. Britannia
  year: 2014
  writers:
  - Marc Jailloux
  - Mathieu Bréda
  artists:
  - Marc Jailloux
  bedetheque_url: https://www.bedetheque.com/BD-Alix-Tome-33-Britannia-212776.html
  rating: 4
  reread: true
  review: |-
    - The art of Marc Jailloux is excellent.
    - The story is relatively complex. There is Caesar, going to Britain as he was promised riches by Viridoros, the villain of the story who ends up being a traitor. There is Mancios, a prince of Britain, who helps Caesar, hoping to retake his position held by an usurper, Cassinos. The druids, including a female druid, are also involved. Caesar and his troops narrowly escape following the treason of Viridoros. It turns out that there wouldn't be many riches to obtain anyway and Caesar leaves Britain, with a promise of never coming back. Alix and Enak play their usual hero roles, siding as well as they can with the good guys, and expressing skepticism towards Caesar's adventure.
- id: luc-orient-le-mur
  read_date: 2025-03
  title: Luc Orient - Le mur
  year: 1994
  writers:
  - Greg
  artists:
  - Eddy Paape
  reread: true
  review: |-
    - 11 pages, with 6 completed and 5 of Greg's scenario only. Unfinished.
    - Paape wasn't enthused with how the scenario was going, and it was not pursued.
    - The incomplete art is great.
    - I wish there had been a few solid "Terango zenith" stories. The characters would have allowed for that. It's just that Greg had a false start here, and then it was too late. This and the flawed Caragal give us a taste of what it could have been.
- id: luc-orient-18-rendez-vous-a-20-heures-en-enfer
  read_date: 2025-03
  title: Luc Orient - 18. Rendez-vous à 20 heures en enfer...
  year: 1984
  writers:
  - Greg
  artists:
  - Eddy Paape
  bedetheque_url: https://www.bedetheque.com/BD-Luc-Orient-Tome-18-Rendez-vous-a-20-heures-en-enfer-4005.html
  rating: 4
  reread: true
  review: |-
    - Published in 1994 but created "10 years earlier".
    - The lab is now called "Eurocristal IV". We don't know what happened to II and III. But Kala, Luc, and Lora all seem to work at IV now.
    - The art is great, and story excellent.
    - There are common time travel ideas present, and the question of free will is raised.
    - I find the panel where Luc comes out of the water on the pod a little weird.
    - The context is that of the end of WWII, when Germany was falling, so it also has very heavy implications.
    - The humorous punch line of the story is nicely found.
