  bedetheque_url: https://www.bedetheque.com/BD-Thorgal-Tome-40-Tupilaks-457535.html
  rating: 4
  reread: true
  review: >-
    I had almost no recollection of reading this album, in spite of having taken some notes three years
    ago! In those notes, I complained a little about the over-explanations of the ship's history. I am
    a little less bothered by it now. The new information we are getting from this diptych is that the
    Atlantians had genocidal plans for Earth, and that some of them agreed with that plan while others
    didn't. A malevolent (or malevolently-directed) AI is quite terrifying. So-called advanced societies
    turn out not to be so advanced, especially morally, when the metal hits the road. I must disagree
    with the average rating on Bedetheque (2/5), which is quite low, and I would consider it in fact a
    rather good story. Overall, it's a decent arc, and a way to get Jolan a life partner.
