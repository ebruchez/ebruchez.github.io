  notes: >-
    Alcibiade, Marvin, and Pirzuine (who are busy taking care of their newborn) must find how to save
    Horous, who is dying trying to control the "coffre aux esprits", which could not only kill Horous
    but then free all its spirits into the Dungeon. Since that chest came from Blaise Pilozzi, a magician-entrepreneur,
    they first go get his help. He is a not very likable, but very competent, magician. He is also an
    old friend and old classmate of Pirzuine, and there is some complicity between the two, while Blaise
    is otherwise a heartless businessman with everybody. Blaise knows that there is an elf poem, located
    in their central library, which might help solve the issue. So they enter that library. The elves,
    it turns out, are extremely racist and cruel beings. But the team manages to escape with the scroll
    of the poem, thanks to Marvin. With the help of Professor Cormor, the undercover automaton, they unlock
    the solution: the chest, and Horous, must be dropped from a very high place. Marvin jumps into action
    and his dragon friends do it, and the resulting blast creates the "trou aux esprits", as well as makes
    a ghost out of Horous, thanks to a charm by Blaise. In this story, we see again those who care about
    life and friendship, and those who don't.
