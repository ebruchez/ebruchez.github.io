    Not as good, overall, as the first part. Let's be clear: there are some disturbing scenes again, and
    the amount of blood is particularly disturbing.
  notes: |-
    - We continue the story from the previous album.
    - Caïn and Abel meet, and Abel gets Caïn to agree to help him.
    - But the relationship is difficult. In addition, Abel, who was almost a saint, falls for Nina, who only has eyes for Caïn.
    - A lot of the story focuses on the attack of the citadel held by weird "nuns", that look like men. There is blood, and a lot of it. It is weird.
    - We meet Lilith, who controls the colonel chief of the bandits, who believes he is a dog. Abel manages to get him to behave like a human again.
    - But Lilith later betrays the colonel to follow Caïn.
    - The group: Caïn, Abel, Nina, and Lilith, leave the citadel, and have to fight bandits.
    - During that encounter, Nina saves and absolves Caïn, who is somehow converted and leaves with her.
    - The colonel follows them, and promises to get his revenge.
- id: les-fils-d-el-topo-tome-1-cain
  read_date: '2026-10-01'
  title: 'Les Fils d''El Topo - Tome 1: Caïn'
  year: 2016
  writers:
  - Alexandro Jodorowsky
  artists:
  - José Ladrönn
  bedetheque_url: https://www.bedetheque.com/BD-Fils-d-El-Topo-Tome-1-Cain-280653.html
  rating: 5
  reread: true
  review: |-
    - I reread this after a few years.
    - Yes, this is Jodorowsky and his crazy ideas, in the spirit of El Topo, his movie. You like it or you don't like it.
    - But you have to admit that the art is amazing, from beginning to end.
    - There is a lot of magic in this story, which otherwise is set in a Wild West environment.
    - For example, the "saint"'s tomb, with its golden pillars, and magic bridge which judges the visitor.
    - The caricature of religion echoes scenes of El Topo.
    - As always, there are disturbing scenes: the cripples, rape, murder.
    - But there is also beauty: Abel and his mother, for example.
    - I found the scene with the group of blind very human. The huge lady, offering her body, but in joy and fun. Where else would you see such a scene?
    - Finally, the young virgin Nina, following Cain as if preordained, is troubling and intriguing.
    - I can now set a 5/5 rating.
- id: blake-et-mortimer-30-signe-olrik
  read_date: '2026-09-30'
  title: Blake et Mortimer - 30. Signé Olrik
  language: French
  writers:
  - Yves Sente
  artists:
  - André Juillard
  bedetheque_url: https://www.bedetheque.com/BD-Blake-et-Mortimer-Les-Aventures-de-Tome-30-Signe-Olrik-505570.html
  review: |-
    - A classic-style Blake et Mortimer story. Overall, it's not too bad, and you do want to know what will happen.
    - The title of the story could be much better and have an actual connection to the story.
    - Good art from the late Juillard, but almost too "clean" — probably due to computer processing/coloring.
    - However, I found issues with the scenes on horseback: the horse seems detached from the ground!
  notes: |-
    - Olrik, in prison, learns of a group of Cornwall nationalists who want to find Arthur's tomb and treasure.
    - Pr. Mortimer just announced his latest invention, a machine to travel underground.
    - We learn that there is a grandmaster, and you can fairly easily guess who it is halfway through.
    - Olrik helps the nationalists steal Mortimer's machine, they find the tomb, but then Olrik wants to steal the treasure.
    - As expected, the tomb is destroyed, the grandmaster dies, but Olrik escapes with the sheath of Excalibur.
