  rating: 3
  reread: true
  review: >-
    Overall, a fairly standard Thorgal story, ok but not particularly exciting. In short, I mostly agree
    with the reviews on Bédéthèque, but I wouldn't put this album below Neokóra/Tupilaks, which I consider
    to be a better story. Here we learn more about Boréale, who was an astrophysicist, specialized in
    quantum physics, no less. Now, she has to deal with a much less developed world (although not necessarily
    morally worse overall).
  notes: >-
    We had left Thorgal, Jolan and Boréale (plus a certain Sven — where does he come out from?) on a small
    ship. That ship is about to sink, but is able to reach an island. Thorgal manages to swim to the mainland,
    but is captured in a fairly typical way by a cruel village chief. Thorgal has to find a special stone
    underground, and then he'll be freed and able to provide help to Jolan and Boréale. Of course the
    chief does not keep his word. But Thorgal is eventually able to escape and save Jolan and Boréale.
    The other main character, Mýsla, who had helped Thorgal, doesn't make it. Boréale makes it only thanks
    to Jolan's asking Odin's crows.
