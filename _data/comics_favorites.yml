- id: fav-yoko-tsuno
  title: Yoko Tsuno
  authors:
  - Roger Leloup
  bedetheque_url: https://www.bedetheque.com/serie-149-BD-Yoko-Tsuno.html
  url: https://fr.wikipedia.org/wiki/Yoko_Tsuno
  cover_label: 'Tome 1: Le Trio de l''étrange'
  cover_query: Le Trio de l'étrange Yoko Tsuno Leloup
  review: >-
    One particularity of this series is that the hero is a woman and women constitute the majority of
    the important characters of the stories (even though the author, Roger Leloup, is a man). This never
    bothered me the least as a boy and, as an adult, I still love the series.
  cover: fav-yoko-tsuno.webp
- id: fav-achille-talon
  title: Achille Talon
  authors:
  - Greg
  bedetheque_url: https://www.bedetheque.com/serie-33-BD-Achille-Talon.html
  cover_label: 'Tome 5: Achille Talon... mon fils à moi !'
  cover_query: Achille Talon cerveau-choc Greg
  review: >-
    This series has been a favorite of mine ever since I encountered it (only the original albums by Greg).
    It is probably impossible to translate this to English or other languages, as the humor is often tied
    to the French language. Greg even went to the US for a while to promote his character, without success.
  cover: fav-achille-talon.webp
- id: fav-alix
  title: Alix
  authors:
  - Jacques Martin
  url: https://fr.wikipedia.org/wiki/Alix_(bande_dessin%C3%A9e)
  cover_label: 'Tome 1: Alix l''intrépide'
  cover_query: Alix l'intrépide Jacques Martin
  review: >-
    Jacques Martin created this genre where the story takes place during Roman antiquity. He started with
    *Alix*, and later created a modern counterpart with *Lefranc*.
  cover: fav-alix.webp
- id: fav-lefranc
  title: Lefranc
  authors:
  - Jacques Martin
  bedetheque_url: https://www.bedetheque.com/serie-187-BD-Lefranc.html
  cover_label: 'Tome 4: Le Repaire du loup (art by Bob de Moor)'
  cover_query: Lefranc tome 4 Le repaire du loup Martin
  review: >-
    The other major character created by Jacques Martin; some of the stories in this series are just very
    good. My favorite might be [Le Repaire du loup](https://fr.wikipedia.org/wiki/Le_Repaire_du_loup)
    ([Bédéthèque](https://www.bedetheque.com/album-28161-BD-Le-repaire-du-loup.html)), drawn by Bob de
    Moor, which is a masterpiece of the genre. Unfortunately, de Moor was not allowed by the Studios Hergé
    to continue working on Lefranc.
  cover: fav-lefranc.webp
- id: fav-blake-et-mortimer
  title: Blake et Mortimer (the original series)
  authors:
  - Edgar P. Jacobs
  bedetheque_url: https://www.bedetheque.com/serie-1850-BD-Blake-et-Mortimer.html
  url: https://fr.wikipedia.org/wiki/Blake_et_Mortimer
  cover_label: 'Tome 6: La Marque jaune'
  cover_query: La Marque jaune Jacobs
  review: >-
    You can just read and re-read these albums without ever tiring of them. See also my
    [2004 review of *La Damnation d'Edgar P. Jacobs*](/posts/la-damnation-d-edgar-p-jacobs/),
