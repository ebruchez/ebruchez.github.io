  cover: fav-blake-et-mortimer.webp
- id: fav-thorgal
  title: Thorgal
  writers:
  - Jean Van Hamme
  artists:
  - Grzegorz Rosiński
  bedetheque_url: https://www.bedetheque.com/serie-12-BD-Thorgal.html
  cover_label: 'Tome 1: La Magicienne trahie'
  cover_query: Thorgal tome 1 La magicienne trahie Rosinski
  review: >-
    An excellent series mixing northern mythology and science-fiction at times, always with adventure.
    The art by Grzegorz Rosiński evolved over time from album 1 to album 36 (1980 to 2018); album 37,
    from 2019, features a new cartoonist, Fred Vignaux. Writers: Jean Van Hamme (1–29), Yves Sente (30–34),
    Xavier Dorison (35), Yann (36–37).
  cover: fav-thorgal.webp
